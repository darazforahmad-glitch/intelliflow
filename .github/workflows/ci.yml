# Continuous integration (Section 5.6): every pull request must pass linting, type checks
# and tests before it can be merged.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: intelliflow
          POSTGRES_PASSWORD: intelliflow
          POSTGRES_DB: intelliflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U intelliflow" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://intelliflow:intelliflow@localhost:5432/intelliflow_test
      DATABASE_URL: postgresql+psycopg://intelliflow:intelliflow@localhost:5432/intelliflow_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Ruff (PEP 8 and bug patterns)
        run: ruff check app tests
      - name: Black
        run: black --check app tests
      - name: mypy
        run: mypy app
      - name: Migrations apply and match the models
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
      - name: Tests on PostgreSQL 16 (coverage gate 70%)
        run: pytest --cov=app --cov-report=term
      - name: Dependency vulnerability scan
        run: pip install pip-audit && pip-audit -r requirements.lock

  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
      - name: Dependency vulnerability scan
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: intelliflow
          POSTGRES_PASSWORD: intelliflow
          POSTGRES_DB: intelliflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U intelliflow" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+psycopg://intelliflow:intelliflow@localhost:5432/intelliflow
      REDIS_URL: redis://localhost:6379/0
      CELERY_TASK_ALWAYS_EAGER: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the API
        working-directory: backend
        run: |
          pip install -e .
          alembic upgrade head
          python -m app.cli seed
          nohup uvicorn app.main:app --port 8000 > api.log 2>&1 &
      - name: Build and start the web app
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npx next start -p 3000 > web.log 2>&1 &
          npx playwright install --with-deps chromium
          for i in $(seq 1 60); do curl -sf http://localhost:3000/login >/dev/null && curl -sf http://localhost:8000/readyz >/dev/null && break; sleep 1; done
      - name: Playwright
        working-directory: frontend
        run: npm run test:e2e
      - if: failure()
        run: tail -n 100 backend/api.log frontend/web.log
