# Development environment (Section 5.3): PostgreSQL 16, Redis 7, API, Celery worker and
# Beat, and the web app.  `docker compose up --build`, then open http://localhost:3000
name: intelliflow

x-backend: &backend
  build: ./backend
  env_file:
    - path: .env
      required: false
  environment: &backend-env
    ENVIRONMENT: development
    DATABASE_URL: postgresql+psycopg://intelliflow:intelliflow@postgres:5432/intelliflow
    REDIS_URL: redis://redis:6379/0
    CELERY_TASK_ALWAYS_EAGER: "false"
    API_PUBLIC_URL: http://localhost:8000
    FRONTEND_URL: http://localhost:3000
    CORS_ORIGINS: http://localhost:3000
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: intelliflow
      POSTGRES_PASSWORD: intelliflow
      POSTGRES_DB: intelliflow
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intelliflow -d intelliflow"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  migrate:
    <<: *backend
    command: sh -c "alembic upgrade head && python -m app.cli seed"
    restart: "no"

  api:
    <<: *backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app
    ports: ["8000:8000"]
    volumes: ["./backend/app:/app/app"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *backend
    command: celery -A app.worker.celery_app:celery_app worker --loglevel=INFO --concurrency=2 -Q intelliflow
    depends_on:
      migrate:
        condition: service_completed_successfully

  beat:
    <<: *backend
    command: celery -A app.worker.celery_app:celery_app beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
