# Development environment (Section 5.3): PostgreSQL 16, Redis 7, API, Celery worker and
# Beat, and the web app.
#
#   docker compose up --build        then open http://localhost:3000
#
# The first start also loads the demo workspace (demo@intelliflow.pk / Demo12345);
# set SEED_DEMO=false to start empty. PostgreSQL and Redis are only reachable inside the
# Compose network, so a PostgreSQL or Redis already installed on the machine cannot clash.
# If port 3000 or 8000 is taken, pick others: WEB_PORT=3100 API_PORT=8100 docker compose up --build
name: intelliflow

x-backend: &backend
  build: ./backend
  env_file:
    - path: .env
      required: false
  environment: &backend-env
    ENVIRONMENT: development
    DATABASE_URL: postgresql://intelliflow:intelliflow@postgres:5432/intelliflow
    REDIS_URL: redis://redis:6379/0
    CELERY_TASK_ALWAYS_EAGER: "false"
    API_PUBLIC_URL: http://localhost:${API_PORT:-8000}
    FRONTEND_URL: http://localhost:${WEB_PORT:-3000}
    CORS_ORIGINS: http://localhost:${WEB_PORT:-3000}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  # The image's health check probes the HTTP API; only the api service serves it.
  healthcheck:
    disable: true
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: intelliflow
      POSTGRES_PASSWORD: intelliflow
      POSTGRES_DB: intelliflow
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intelliflow -d intelliflow"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # One-off: migrations, template library and (first start only) the demo workspace.
  # A failed demo load is reported but does not stop the app from starting.
  migrate:
    <<: *backend
    environment:
      <<: *backend-env
      SEED_DEMO: ${SEED_DEMO:-true}
    command:
      - sh
      - -c
      - |
        set -e
        python manage.py migrate --noinput
        python manage.py seed
        if [ "$$SEED_DEMO" = "true" ]; then
          python manage.py demo || echo "WARNING: demo data could not be loaded (see the error above)."
        fi
    restart: "no"

  api:
    <<: *backend
    # Django's dev server: reloads on code changes; production uses Gunicorn (image default).
    command: python manage.py runserver 0.0.0.0:8000
    ports: ["${API_PORT:-8000}:8000"]
    volumes: ["./backend/intelliflow:/app/intelliflow", "./backend/config:/app/config"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *backend
    command: celery -A config worker --loglevel=INFO --concurrency=2 -Q intelliflow
    depends_on:
      migrate:
        condition: service_completed_successfully

  beat:
    <<: *backend
    command: celery -A config beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}
    command: ["sh", "-c", "echo 'IntelliFlow is ready: open http://localhost:${WEB_PORT:-3000}' && exec node server.js"]
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
