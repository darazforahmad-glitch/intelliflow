<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · IntelliFlow</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f8fafc;
        color: #0f172a;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      main {
        max-width: 22rem;
        padding: 2rem;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 1rem 0 0.5rem;
      }
      p {
        color: #475569;
        line-height: 1.5;
      }
      button {
        margin-top: 1rem;
        min-height: 44px;
        padding: 0 1.25rem;
        border: 0;
        border-radius: 0.75rem;
        background: #4f46e5;
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>
        IntelliFlow needs an internet connection to load approvals and send decisions. Your pending work is
        safe.
      </p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
